name: Domain feed

on:
  schedule:
    # 16:40 UTC = 22:40 Dhaka (after GoDaddy's daily file update)
    - cron: "40 16 * * *"
    # 00:50 UTC = 06:50 Dhaka (fresh data before the 08:13 agent run)
    - cron: "50 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and filter auctions
        run: python fetch_and_filter.py
      - name: Commit shortlist
        if: always()
        run: |
          git config user.name "domain-feed-bot"
          git config user.email "domain-feed-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Update domain feed $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
